name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, matching config/release.json (without a v prefix). Omitting this field will not produce any release.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ruyisdk-ide-${{ github.event_name == 'workflow_dispatch' && 'release' || github.run_id }}
  cancel-in-progress: false

jobs:
  configure:
    name: Configure build and validate release request
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Configure all packaging targets
        id: matrix
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: >-
          node scripts/release/configure-workflow.js
          --event="$RUN_EVENT"
          --ref="$RUN_REF"
          --requested-version="$REQUESTED_VERSION"
          -- "$GITHUB_OUTPUT"

      - name: Retrieve GitHub release metadata
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs')
            const path = require('node:path')
            const config = require('./config/release.json')
            const absentOn404 = async (request) => {
              try {
                return await request()
              } catch (error) {
                if (error.status === 404) return undefined
                throw error
              }
            }
            const [releases, tag] = await Promise.all([
              github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }),
              absentOn404(() => github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${config.releaseVersion}`,
              })),
            ])
            const data = {
              releaseExists: releases.some((release) => release.tag_name === config.releaseVersion),
              tagExists: Boolean(tag),
            }
            const directory = path.join(process.env.GITHUB_WORKSPACE, '.cache')
            fs.mkdirSync(directory, { recursive: true })
            fs.writeFileSync(path.join(directory, 'release-state.json'), `${JSON.stringify(data, null, 2)}\n`)

      - name: Validate GitHub metadata and release inputs
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: node scripts/release/release.js check .cache/release-state.json "$GITHUB_OUTPUT"

  dco:
    name: DCO compliance
    needs: configure
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check sign-offs on pushed or proposed commits
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: christophebedard/dco-check@ec8bfc43106afe98b323ace9133650df10497e12 # v0.5.1
        with:
          python-version: '3.12'
          args: '--verbose'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Validate source and prepare bundled extensions
    needs: [configure, dco]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22.12'
          cache: false

      - name: Install script dependencies
        run: npm ci --prefix scripts

      - name: Lint JavaScript
        run: npm run lint --prefix scripts

      - name: Run packaging tests
        run: npm test --prefix scripts

      - name: Prepare extension inputs
        run: node scripts/release/prepare-inputs.js extensions

      - name: Build and download bundled extensions
        run: node scripts/release/prepare-extensions.js

      - name: Share bundled extensions with package jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundled-extensions
          path: .cache/extensions/*.vsix
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [configure, check]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install script dependencies
        run: npm ci --prefix scripts

      - name: Download prepared bundled extensions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundled-extensions
          path: .cache/extensions

      - name: Prepare target archive
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/release/prepare-inputs.js target -- "$TARGET_PLATFORM" "$TARGET_ARCH"

      - name: Generate icons
        run: |
          npm test --prefix scripts
          node scripts/release/generate-icons.js

      - name: Build platform package
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/release/package.js -- "$TARGET_PLATFORM" "$TARGET_ARCH"

      - name: Upload package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruyisdk-ide-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish complete release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    needs: [configure, dco, check, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Download all six packages and checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ruyisdk-ide-*
          path: release-assets
          merge-multiple: true

      - name: Verify release packages and prepare notes
        run: |
          node scripts/release/release.js verify release-assets
          node scripts/release/release.js notes release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.version }}
          name: RuyiSDK IDE ${{ inputs.version }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
