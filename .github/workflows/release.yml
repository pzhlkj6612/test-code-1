name: Publish RuyiSDK IDE

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ruyisdk-ide-release
  cancel-in-progress: false

jobs:
  check:
    name: Validate release and prepare bundled extensions
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22.12"
          cache: false
      - name: Install scripts dependencies
        run: npm ci --prefix scripts
      - name: Lint JavaScript
        run: npm run lint --prefix scripts
      - name: Run packaging tests
        run: npm test --prefix scripts
      - name: Validate pinned release and all six upstream packages
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/release.js check
      - name: Build CanMV and download checksum-verified release extensions
        run: node scripts/release/prepare-extensions.js
      - name: Share bundled extensions with all package jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundled-extensions
          path: |
            .cache/extensions/*.vsix
            .cache/extensions/*.vsix.sha256
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install icon generator
        run: npm ci --prefix scripts
      - name: Download prepared bundled extensions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bundled-extensions
          path: .cache/extensions
      - name: Test and generate icons
        run: |
          npm test --prefix scripts
          node scripts/release/generate-icons.js
      - name: Repackage checksum-verified VSCodium
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/release/package.js "$TARGET_PLATFORM" "$TARGET_ARCH"
      - name: Upload package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish complete release
    needs: [check, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums, upload draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/release.js publish release-assets
